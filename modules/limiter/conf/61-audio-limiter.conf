# The Windows audio engine's output limiter, on every playback device, as
# Windows does: after the mix and the software volume, always on. It keeps
# Loudness Equalization's boost (and anything else going over full scale)
# from clipping.
#
# Per-user override: copy to ~/.config/pipewire/pipewire.conf.d/ with the
# same file name and edit; to disable for one user, override with an empty
# context.modules = [ ] in that file.
context.modules = [
    {   name = libpipewire-module-audio-limiter
        args = {
            # Leave some devices alone, e.g.:
            # device.rules = [
            #     { matches = [ { node.name = "~alsa_output.usb-*" } ]
            #       actions = { audio-limiter = false } }
            # ]
        }
        flags = [ nofail ]
    }
]
