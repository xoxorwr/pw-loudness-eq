# Loudness Equalization (Windows algorithm), applied per application like
# Windows does: every app playback stream gets its own instance, running
# inside that stream before its volume and before mixing. No extra device.
#
# Per-user override: copy to ~/.config/pipewire/pipewire.conf.d/ with the
# same file name and edit; to disable for one user, override with an empty
# context.modules = [ ] in that file.
context.modules = [
    {   name = libpipewire-module-loudness-eq
        args = {
            # Windows "Release Time": 2 (fast) .. 7 (slow). Windows default 4.
            release = 4
            # Exclude apps, e.g.:
            # stream.rules = [
            #     { matches = [ { application.name = "Discord" } ]
            #       actions = { loudness-eq = false } }
            # ]
        }
        flags = [ nofail ]
    }
]
